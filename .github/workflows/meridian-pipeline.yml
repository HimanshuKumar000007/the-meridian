name: Meridian Automation Orchestrator

on:
  schedule:
    # Run every 1 hour
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  orchestrate:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Meridian Pipeline
        run: |
          echo "Triggering Meridian news pipeline..."
          curl -s -X POST "https://themeridian.in/api/automation/orchestrator" \
            -H "Authorization: Bearer ${{ secrets.AUTOMATION_CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d '{"trigger":"cron"}' \
            --max-time 130 \
            || echo "Pipeline trigger completed"
