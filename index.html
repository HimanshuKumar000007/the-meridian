<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Meridian — Global News, Technology, AI & World Affairs</title>
    <meta name="description" content="Independent global journalism delivering rigorous reporting and timely analysis on artificial intelligence, science, business, technology, gaming, and world affairs." />
    
    <!-- OpenGraph Metadata -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="The Meridian" />
    <meta property="og:title" content="The Meridian — Global News, Technology, AI & World Affairs" />
    <meta property="og:description" content="Independent global journalism delivering rigorous reporting and timely analysis on artificial intelligence, science, business, technology, gaming, and world affairs." />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@TheMeridianNews" />
    <meta name="twitter:title" content="The Meridian — Global News, Technology, AI & World Affairs" />
    <meta name="twitter:description" content="Independent global journalism delivering rigorous reporting and timely analysis on artificial intelligence, science, business, technology, gaming, and world affairs." />

    <!-- Brand Favicon & Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://themeridian.in/" />

    <!-- Google Web Fonts: Newsreader (Editorial Serif) & Plus Jakarta Sans (Clean Modern Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Structured Data: NewsMediaOrganization & WebSite (No deprecated SearchAction) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "NewsMediaOrganization",
          "name": "The Meridian",
          "url": "https://themeridian.in",
          "logo": {
            "@type": "ImageObject",
            "url": "https://themeridian.in/favicon.svg",
            "width": 512,
            "height": 512
          },
          "publishingPrinciples": "https://themeridian.in/editorial-policy",
          "correctionsPolicy": "https://themeridian.in/corrections",
          "ethicsPolicy": "https://themeridian.in/editorial-policy",
          "diversityPolicy": "https://themeridian.in/about",
          "masthead": "https://themeridian.in/about"
        },
        {
          "@type": "WebSite",
          "name": "The Meridian",
          "url": "https://themeridian.in"
        }
      ]
    }
    </script>
  </head>
  <body class="bg-[#FAF9F6] text-[#141517] antialiased selection:bg-stone-200 selection:text-stone-900">
